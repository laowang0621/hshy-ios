workflows:
  unity-ios:
    name: Unity iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        UNITY_VERSION: "2021.3.14f1"
        UNITY_CHANGESET: "eee1884e7226"
        UNITY_EMAIL: "3484372582@qq.com"
        UNITY_PASSWORD: "Aa50022620100621!"
    cache:
      cache_paths:
        - /tmp/unity_pkg
    scripts:
      - name: Install Unity Editor
        script: |
          set -x
          mkdir -p /tmp/unity_pkg
          ARM_URL="https://download.unity3d.com/download_unity/$UNITY_CHANGESET/MacEditorInstallerArm64/Unity-$UNITY_VERSION.pkg"
          X64_URL="https://download.unity3d.com/download_unity/$UNITY_CHANGESET/MacEditorInstaller/Unity-$UNITY_VERSION.pkg"
          echo "arch: $(uname -m)"
          if [ ! -f /tmp/unity_pkg/unity.pkg ]; then
            curl -L --retry 3 --retry-delay 3 -o /tmp/unity_pkg/unity.pkg "$ARM_URL" || curl -L --retry 3 -o /tmp/unity_pkg/unity.pkg "$X64_URL"
          fi
          ls -lh /tmp/unity_pkg/unity.pkg
          sudo installer -pkg /tmp/unity_pkg/unity.pkg -target / -verboseR 2>&1 | tail -10 || echo "INSTALL_RETRY_NEEDED"
          U=$(find /Applications -maxdepth 7 -type f -name Unity -path "*MacOS*" 2>/dev/null | head -1)
          echo "DETECTED_UNITY=$U"
          if [ -n "$U" ]; then echo "UNITY_PATH=$U" >> $CM_ENV; fi
      - name: Install iOS Build Support
        script: |
          set -x
          if [ -z "$UNITY_PATH" ]; then U=$(find /Applications -maxdepth 7 -type f -name Unity -path "*MacOS*" | head -1); echo "UNITY_PATH=$U" >> $CM_ENV; else U="$UNITY_PATH"; fi
          ENGINES="$(dirname "$(dirname "$(dirname "$(dirname "$U")")")")/PlaybackEngines"
          echo "ENGINES=$ENGINES"
          if [ ! -d "$ENGINES/iOSSupport" ]; then
            curl -L --retry 3 -o /tmp/unity_pkg/ios.pkg "https://download.unity3d.com/download_unity/$UNITY_CHANGESET/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-$UNITY_VERSION.pkg"
            sudo installer -pkg /tmp/unity_pkg/ios.pkg -target / -verboseR 2>&1 | tail -5 || echo "IOS_MODULE_FAILED"
          fi
          ls "$ENGINES" 2>/dev/null || true
      - name: Generate Unity activation file (.alf)
        script: |
          set -x
          if [ -z "$UNITY_PATH" ]; then U=$(find /Applications -maxdepth 7 -type f -name Unity -path "*MacOS*" | head -1); else U="$UNITY_PATH"; fi
          echo "using $U"
          mkdir -p "$CM_BUILD_DIR/alf"
          cd "$CM_BUILD_DIR/alf"
          "$U" -quit -batchmode -nographics -createManualActivationFile -logFile /tmp/alf.log || true
          find . -maxdepth 2 -type f | head -20
          find / -name "*.alf" -newermt "-10 minutes" 2>/dev/null | head -5
          cp -v *.alf "$CM_BUILD_DIR/" 2>/dev/null || true
          ls -la "$CM_BUILD_DIR" | head -20
          tail -20 /tmp/alf.log 2>/dev/null || true
      - name: Locate Unity and report
        script: |
          set -x
          U="$UNITY_PATH"
          if [ -z "$U" ] || [ ! -x "$U" ]; then
            U=$(find /Applications -maxdepth 7 -type f -name Unity -path "*MacOS*" 2>/dev/null | head -1)
            echo "UNITY_PATH=$U" >> $CM_ENV
          fi
          echo "FINAL_UNITY=$U"
          "$U" -version || echo "VERSION_FAIL"
      - name: Activate license (manual ulf if present)
        script: |
          set -x
          if [ -z "$UNITY_PATH" ]; then U=$(find /Applications -maxdepth 7 -type f -name Unity -path "*MacOS*" | head -1); else U="$UNITY_PATH"; fi
          if [ -f "Unity_v${UNITY_VERSION}.ulf" ]; then
            echo "found ulf, activating manually"
            "$U" -quit -batchmode -nographics -manualLicenseFile "Unity_v${UNITY_VERSION}.ulf" -logFile /tmp/lic.log || true
            tail -20 /tmp/lic.log
          else
            echo "NO_ULF_FILE_PRESENT -> falling back to credentials"
            "$U" -quit -batchmode -nographics -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile /tmp/lic.log || true
            tail -25 /tmp/lic.log
          fi
      - name: Build iOS Xcode project
        script: |
          set -x
          if [ -z "$UNITY_PATH" ]; then U=$(find /Applications -maxdepth 7 -type f -name Unity -path "*MacOS*" | head -1); else U="$UNITY_PATH"; fi
          "$U" -quit -batchmode -nographics -projectPath . -buildTarget iOS -executeMethod BuildScript.BuildIOS -logFile /tmp/unity_build.log || (tail -120 /tmp/unity_build.log; exit 1)
          tail -30 /tmp/unity_build.log
      - name: Archive unsigned ipa
        script: |
          set -e
          cd build/ios
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" archive
      - name: Package ipa
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$CM_BUILD_DIR/App.xcarchive/Products/Applications/Unity-iPhone.app" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -qr hshy-unsigned.ipa Payload
          ls -lh hshy-unsigned.ipa
    artifacts:
      - "*.alf"
      - hshy-unsigned.ipa
      - build/ios/Unity-iPhone.xcodeproj
