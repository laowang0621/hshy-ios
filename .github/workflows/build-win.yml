name: Build iOS (Windows -> Xcode project)

on:
  workflow_dispatch:
  push:
    paths:
      - "Unity_lic.ulf"

jobs:
  build:
    name: Unity iOS build on Windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Editor
        uses: actions/cache@v4
        with:
          path: C:\Unity
          key: unity-2022.3.62f3-win-v2

      - name: Install Unity Editor
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Unity\Editor\Unity.exe")) {
            $url = "https://download.unity3d.com/download_unity/96770f904ca7/Windows64EditorInstaller/UnitySetup64-2022.3.62f3.exe"
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\unity.exe" -UseBasicParsing
            Get-Item "$env:TEMP\unity.exe" | Select-Object Length
            Start-Process -FilePath "$env:TEMP\unity.exe" -ArgumentList "/S","/D=C:\Unity" -Wait
          }
          if (Test-Path "C:\Unity\Editor\Unity.exe") { Write-Host "UNITY_OK" } else { throw "unity install failed" }

      - name: Install iOS Build Support
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Unity\Editor\Data\PlaybackEngines\iOSSupport")) {
            $url = "https://download.unity3d.com/download_unity/96770f904ca7/TargetSupportInstaller/UnitySetup-iOS-Support-for-Editor-2022.3.62f3.exe"
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ios.exe" -UseBasicParsing
            Start-Process -FilePath "$env:TEMP\ios.exe" -ArgumentList "/S","/D=C:\Unity" -Wait
          }
          Get-ChildItem "C:\Unity\Editor\Data\PlaybackEngines" | Select-Object Name

      - name: Activate Unity license
        shell: pwsh
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          Write-Host "=== repo ulf files ==="
          Get-ChildItem -Recurse -Filter *.ulf -ErrorAction SilentlyContinue | Select-Object FullName
          $ulf = Get-ChildItem -Path . -Filter "*.ulf" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ulf) {
            Write-Host "FOUND_ULF: $($ulf.FullName)"
            $p = Start-Process -FilePath 'C:\Unity\Editor\Unity.exe' `
              -ArgumentList '-quit','-batchmode','-nographics','-manualLicenseFile',$ulf.FullName,'-logFile','C:\unity_lic.log' `
              -Wait -PassThru -NoNewWindow
            Write-Host "exitcode=$($p.ExitCode)"
          } else {
            Write-Host "NO_ULF_IN_REPO -> try credentials"
            $p = Start-Process -FilePath 'C:\Unity\Editor\Unity.exe' `
              -ArgumentList '-quit','-batchmode','-nographics','-username',$env:UNITY_EMAIL,'-password',$env:UNITY_PASSWORD,'-logFile','C:\unity_lic.log' `
              -Wait -PassThru -NoNewWindow
            Write-Host "exitcode=$($p.ExitCode)"
          }
          if (Test-Path 'C:\unity_lic.log') { Get-Content 'C:\unity_lic.log' -Tail 40 }
          Write-Host "=== verify license by version call ==="
          $v = Start-Process -FilePath 'C:\Unity\Editor\Unity.exe' -ArgumentList '-quit','-batchmode','-nographics','-logFile','C:\unity_verify.log' -Wait -PassThru -NoNewWindow
          Write-Host "verify exit=$($v.ExitCode)"
          if (Test-Path 'C:\unity_verify.log') {
            Get-Content 'C:\unity_verify.log' -Tail 15
            if (Select-String -Path 'C:\unity_verify.log' -Pattern 'No valid Unity Editor license' -Quiet) {
              Write-Host "STILL_NO_LICENSE"; exit 1
            }
          }
          Write-Host "LICENSE_OK"

      - name: Build iOS Xcode project
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'C:\Unity\Editor\Unity.exe' `
            -ArgumentList '-quit','-batchmode','-nographics','-projectPath',"$PWD",'-buildTarget','iOS','-executeMethod','BuildScript.BuildIOS','-logFile','C:\unity_build.log' `
            -Wait -PassThru -NoNewWindow
          Write-Host "exitcode=$($p.ExitCode)"
          Get-Content 'C:\unity_build.log' -Tail 80 -ErrorAction SilentlyContinue
          if (-not (Test-Path "build\ios")) {
            Write-Host "NO_BUILD_DIR"; Get-ChildItem -Force | Select-Object Name; exit 1
          }
          Get-ChildItem "build\ios" | Select-Object Name

      - name: Zip Xcode project
        shell: pwsh
        run: |
          Compress-Archive -Path "build\ios\*" -DestinationPath "$env:GITHUB_WORKSPACE\xcode-project.zip" -Force
          Get-Item "xcode-project.zip" | Select-Object Length

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.zip
          retention-days: 7
          if-no-files-found: warn
