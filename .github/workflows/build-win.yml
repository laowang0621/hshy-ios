name: Build iOS (Windows -> Xcode project)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-win.yml"

jobs:
  build:
    name: Unity iOS build on Windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Editor
        uses: actions/cache@v4
        with:
          path: C:\Unity
          key: unity-2021.3.14f1-win-v1

      - name: Install Unity Editor
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Unity\Editor\Unity.exe")) {
            $url = "https://download.unity3d.com/download_unity/eee1884e7226/Windows64EditorInstaller/UnitySetup64-2021.3.14f1.exe"
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\unity.exe" -UseBasicParsing
            Get-Item "$env:TEMP\unity.exe" | Select-Object Length
            Start-Process -FilePath "$env:TEMP\unity.exe" -ArgumentList "/S","/D=C:\Unity" -Wait
          }
          if (Test-Path "C:\Unity\Editor\Unity.exe") { Write-Host "UNITY_OK" } else { throw "unity install failed" }

      - name: Install iOS Build Support
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Unity\Editor\Data\PlaybackEngines\iOSSupport")) {
            $url = "https://download.unity3d.com/download_unity/eee1884e7226/TargetSupportInstaller/UnitySetup-iOS-Support-for-Editor-2021.3.14f1.exe"
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ios.exe" -UseBasicParsing
            Start-Process -FilePath "$env:TEMP\ios.exe" -ArgumentList "/S","/D=C:\Unity" -Wait
          }
          Get-ChildItem "C:\Unity\Editor\Data\PlaybackEngines" | Select-Object Name

      - name: Unity smoke test
        shell: pwsh
        run: |
          Write-Host "exists: $(Test-Path 'C:\Unity\Editor\Unity.exe')"
          (Get-Item 'C:\Unity\Editor\Unity.exe').VersionInfo | Select-Object FileVersion,ProductVersion
          Write-Host "--- try -version ---"
          $p = Start-Process -FilePath 'C:\Unity\Editor\Unity.exe' -ArgumentList '-version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:TEMP\v.out" -RedirectStandardError "$env:TEMP\v.err"
          Write-Host "exitcode=$($p.ExitCode)"
          Write-Host "--- stdout ---"; Get-Content "$env:TEMP\v.out" -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content "$env:TEMP\v.err" -ErrorAction SilentlyContinue
          Write-Host "--- try batchmode log ---"
          $p2 = Start-Process -FilePath 'C:\Unity\Editor\Unity.exe' -ArgumentList '-quit','-batchmode','-nographics','-logFile','C:\unity_smoke.log' -Wait -PassThru -NoNewWindow
          Write-Host "exitcode2=$($p2.ExitCode)"
          if (Test-Path 'C:\unity_smoke.log') { Get-Content 'C:\unity_smoke.log' -Tail 40 } else { Write-Host "NO_SMOKE_LOG" }

      - name: Activate Unity license
        shell: pwsh
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $p = Start-Process -FilePath 'C:\Unity\Editor\Unity.exe' `
            -ArgumentList '-quit','-batchmode','-nographics','-username',$env:UNITY_EMAIL,'-password',$env:UNITY_PASSWORD,'-logFile','C:\unity_lic.log' `
            -Wait -PassThru -NoNewWindow
          Write-Host "exitcode=$($p.ExitCode)"
          if (Test-Path 'C:\unity_lic.log') {
            Get-Content 'C:\unity_lic.log' -Tail 40
            if (Select-String -Path 'C:\unity_lic.log' -Pattern 'Failed to activate|Missing or bad username|No valid Unity Editor license' -Quiet) {
              Write-Host "LICENSE_ACTIVATION_FAILED"; exit 1
            }
          } else {
            Write-Host "NO_LIC_LOG"; exit 1
          }
          Write-Host "LICENSE_STEP_DONE"

      - name: Build iOS Xcode project
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'C:\Unity\Editor\Unity.exe' `
            -ArgumentList '-quit','-batchmode','-nographics','-projectPath',"$PWD",'-buildTarget','iOS','-executeMethod','BuildScript.BuildIOS','-logFile','C:\unity_build.log' `
            -Wait -PassThru -NoNewWindow
          Write-Host "exitcode=$($p.ExitCode)"
          Get-Content 'C:\unity_build.log' -Tail 80 -ErrorAction SilentlyContinue
          if (-not (Test-Path "build\ios")) {
            Write-Host "NO_BUILD_DIR"; Get-ChildItem -Force | Select-Object Name; exit 1
          }
          Get-ChildItem "build\ios" | Select-Object Name

      - name: Zip Xcode project
        shell: pwsh
        run: |
          Compress-Archive -Path "build\ios\*" -DestinationPath "$env:GITHUB_WORKSPACE\xcode-project.zip" -Force
          Get-Item "xcode-project.zip" | Select-Object Length

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.zip
          retention-days: 7
          if-no-files-found: warn
