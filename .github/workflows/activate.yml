name: Acquire Unity License

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file (.alf)
    runs-on: ubuntu-latest
    steps:
      - id: act
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.3.14f1
      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation
          path: ${{ steps.act.outputs.filePath }}
