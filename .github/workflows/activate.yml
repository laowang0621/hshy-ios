name: Acquire Unity License

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate Unity manual activation file (.alf)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare workspace
        run: mkdir -p out

      - name: Pull GameCI editor image
        run: |
          set -e
          for tag in ubuntu-2021.3.14f1-base-3 ubuntu-2021.3.14f1-base-2 2021.3.14f1-base-3; do
            echo "trying unityci/editor:$tag"
            if docker pull "unityci/editor:$tag"; then
              echo "IMAGE=unityci/editor:$tag" >> $GITHUB_ENV
              break
            fi
          done
          test -n "$IMAGE" || (echo "no image tag matched"; exit 1)

      - name: Create .alf
        run: |
          set -e
          docker run --rm -v "$PWD/out:/out" -w /out \
            "$IMAGE" \
            unity-editor -batchmode -nographics -quit -createManualActivationFile -logFile /dev/stdout || true
          echo "--- out dir ---"
          ls -la out || true
          echo "--- search alf ---"
          find . -name "*.alf" -print

      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation
          path: "**/*.alf"
          if-no-files-found: error
